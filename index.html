<!DOCTYPE html>
<html>
<head>
    <title>School Admission Form</title>
</head>
<body style="background-color:lightblue; font-family:Arial;">

    <h1 align="center" style="color:darkblue;">
        School Admission Form
    </h1>

    <fieldset style="width:500px; margin:auto; background:white;">


        <form>
            Student Name:<br>
            <input type="text" size="40"><br><br>

            Father's Name:<br>
            <input type="text" size="40"><br><br>

            Mother's Name:<br>
            <input type="text" size="40"><br><br>

            Date of Birth:<br>
            <input type="date"><br><br>

            Gender:
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            Class:
            <select>
                <option>Class 1</option>
                <option>Class 2</option>
                <option>Class 3</option>
                <option>Class 4</option>
                <option>Class 5</option>
                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
                <option>Class 9</option>
                <option>Class 10</option>
                <option>Class 11</option>
                <option>Class 12</option>
            </select>
            <br><br>

            Mobile Number:<br>
            <input type="tel" size="40"><br><br>

            Email:<br>
            <input type="email" size="40"><br><br>

            Address:<br>
            <textarea rows="4" cols="40"></textarea><br><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Clear">
        </form>
    </fieldset>

</body>
</html>
